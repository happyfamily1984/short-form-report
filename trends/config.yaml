# 숏폼 유행 수집 설정 — 여기만 고치면 검색어·모델을 바꿀 수 있습니다.

# 수집 분야: 교육 · 과학 · 다큐멘터리 (얼굴 없이 내레이션으로 만드는 정보형 숏폼)
# 분야마다 한국(kr)·해외(global) 검색어를 따로 둡니다. 검색어 1개 = 유튜브 할당량 100단위.
# 지금 3분야 x (한국 2 + 해외 2) = 12회 = 1,200단위. category 가 있으면 그 유튜브 카테고리만 검색하고,
# 인기 급상승 차트(지역당 1~2단위)에서도 그 카테고리의 짧은 영상을 함께 가져옵니다.
# 장르 이름은 한국은 "교육", 해외는 "해외 교육"처럼 붙습니다.
fields:
  - id: edu
    name: 교육
    category: 27          # 유튜브 카테고리: Education
    kr:
      - 상식 쇼츠
      - 원리 설명 쇼츠
    global:
      - explained shorts
      - did you know facts shorts
  - id: sci
    name: 과학
    category: 28          # 유튜브 카테고리: Science & Technology
    kr:
      - 과학 쇼츠
      - 우주 쇼츠
    global:
      - science facts shorts
      - space shorts
  - id: doc
    name: 다큐
    category:             # 다큐는 따로 된 카테고리가 없어 검색어로만 모읍니다
    kr:
      - 다큐 쇼츠
      - 역사 이야기 쇼츠
    global:
      - documentary shorts
      - history explained shorts

chart: true              # 인기 급상승 차트에서 위 카테고리의 짧은 영상도 가져오기
chart_pages: 1           # 지역·카테고리마다 50개씩 몇 쪽까지 (쪽당 1단위)

global:
  region: US
  language: en

youtube:
  region: KR            # 지역
  language: ko          # 언어
  days: 7               # 최근 며칠 안에 올라온 영상만
  min_views: 20000      # 최소 조회수
  max_duration_sec: 90  # 90초 이하만 (쇼츠)
  results_per_search: 25  # 검색 1회에 받을 영상 수 (최대 50, 할당량은 같음)
  top_per_genre: 10     # 장르별로 남길 영상 수
  comments_per_video: 10  # 인기 댓글 수 (영상당 1단위)
  rank_by: views        # 정렬 기준: views(조회수) / ratio(구독자 대비) / velocity(상승 속도)
  quota_budget: 9000    # 이 단위를 넘을 것 같으면 검색을 멈춤 (하루 한도 10,000)
  retention_days: 30    # 이보다 오래된 원본(raw.json)·누적 기록은 자동 삭제

gemini:
  # 무료 등급 플래시 모델 (2026-11 공식 문서 기준: gemini-3.8-flash = 최신 안정판).
  # gemini-2.5-flash는 2026-12-01부터 지원 종료. 막히면 아래 이름만 바꾸면 됩니다.
  model: gemini-3.8-flash
  fallback_model: gemini-3.5-flash-lite   # 첫 모델이 계속 실패할 때 한 번 시도
  wait_between_requests_sec: 15   # 요청 사이 대기 (분당 한도 보호)
  retry_wait_sec: 60              # 429(한도 초과) 시 기다리는 시간
  max_retries: 3
  thumbnails_per_genre: 3         # 썸네일 이미지 분석은 장르별 상위 3개만
  temperature: 0.7

# 영상 직접 보기: 제미나이가 유튜브 영상을 실제로 보고 장면별 대본·등장인물 외형과 초 단위 분석(timeline)을 적습니다.
# timeline 은 60초 이하 영상은 1초마다, 더 긴 영상은 2초마다 한 칸 (화면·화면 글자·소리·장면 전환·다시 만들 프롬프트).
# 영상 1개 = 요청 1회. 무료 한도가 빠듯하면 max_total 을 줄이거나 0으로 끄세요 (끄면 제목·댓글·썸네일로 추정).
watch:
  max_total: 10         # 하루에 직접 볼 영상 수 (0 = 끔)
  per_genre: 2          # 장르마다 상위 몇 개
  kinds: [edu, sci, doc] # 분야 id. 앞에 적은 것부터 봅니다
  max_duration_sec: 90  # 이보다 긴 영상은 보지 않음 (길수록 토큰을 많이 씀)

telegram:
  top_links_per_genre: 3
