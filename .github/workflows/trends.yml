name: 숏폼 유행 리포트

on:
  # 자동 수집 멈춤 (2026-11-27 사용자 요청). 다시 켜려면 아래 두 줄의 # 를 지운다.
  # schedule:
  #   - cron: "0 21 * * *"   # UTC 21:00 = 한국 시간 매일 아침 6시
  workflow_dispatch:
    inputs:
      sample:
        description: "샘플 데이터로 시험 (키 없이 흐름만 확인)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trends
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trends/requirements.txt

      - name: 준비물 설치
        id: setup
        run: pip install -r trends/requirements.txt

      - name: ① 수집
        id: collect
        run: python trends/scripts/collect.py ${{ inputs.sample && '--sample' || '' }}

      - name: ② 분석
        id: analyze
        run: python trends/scripts/analyze.py

      - name: 텔레그램 전송
        id: notify
        run: python trends/scripts/notify.py

      - name: data 폴더 저장 (커밋·푸시)
        id: commit
        if: always() && steps.collect.outcome == 'success' && !inputs.sample
        run: |
          git config user.name "trends-bot"
          git config user.email "trends-bot@users.noreply.github.com"
          git add trends/data
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "trends: $(TZ=Asia/Seoul date +%F) 리포트"
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: 실패 알림
        if: failure()
        run: |
          STEP="알 수 없음"; KEY=""
          if   [ "${{ steps.setup.outcome }}"   = "failure" ]; then STEP="준비물 설치"
          elif [ "${{ steps.collect.outcome }}" = "failure" ]; then STEP="① 수집"; KEY=collect
          elif [ "${{ steps.analyze.outcome }}" = "failure" ]; then STEP="② 분석"; KEY=analyze
          elif [ "${{ steps.notify.outcome }}"  = "failure" ]; then STEP="텔레그램 전송"
          elif [ "${{ steps.commit.outcome }}"  = "failure" ]; then STEP="data 저장"
          fi
          WHY=$(KEY="$KEY" python trends/scripts/why.py 2>/dev/null || true)
          [ -z "$WHY" ] && WHY="자세한 이유는 깃허브 Actions 기록 확인"
          python trends/scripts/notify.py --fail "${STEP} 단계 실패: ${WHY}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
